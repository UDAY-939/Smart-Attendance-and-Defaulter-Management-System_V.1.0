services:
  - type: web
    name: attendance-defaulter-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --workers 2 --timeout 120
    envVars:
      - key: DATABASE_URL
        sync: false          # you will fill this in Render dashboard (keeps secret safe)
      - key: SECRET_KEY
        sync: false          # you will fill this in Render dashboard
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    autoDeploy: true         # auto re-deploy whenever you push to GitHub
